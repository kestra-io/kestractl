name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
      KESTRA_EE_UNIT_TEST_LICENSE_FILE:
        required: true
      KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE:
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./src/...

      - name: Check installer is working
        run: |
          cat ./install-scripts/install.sh | INSTALL_DIR=./ bash
          ./kestractl --help
      - name: Check installer is working when specifying version
        run: |
          cat ./install-scripts/install.sh | VERSION=1.0.0 INSTALL_DIR=./ bash
          ./kestractl --help

  e2e-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build matrix from compatible versions
        id: matrix
        run: |
          versions=$(awk 'NF { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); printf "%s\"%s\"", sep, $0; sep="," } END { print "" }' COMPATIBLE_KESTRA_VERSION.properties)
          echo "versions=[${versions}]" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: e2e-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kestra_version: ${{ fromJSON(needs.e2e-matrix.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: GCP - Auth with github service account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build local CLI and test it E2E
        env:
          KESTRA_VERSION: ${{ matrix.kestra_version }}
          KESTRA_EE_UNIT_TEST_LICENSE_FILE: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
          KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE }}
        run: |
          version="${KESTRA_VERSION#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -le 2 ]; }; then
            echo "using old KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE for Kestra v1.2 and lower"
            echo KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE | base64 -d > ./e2e_tests/docker-setup/application-secrets.yml
          else
            echo "using KESTRA_EE_UNIT_TEST_LICENSE_FILE for Kestra v1.3 and higher"
            echo KESTRA_EE_UNIT_TEST_LICENSE_FILE | base64 -d > ./e2e_tests/docker-setup/application-secrets.yml
          fi
          
          sh run-e2e-tests.sh $KESTRA_VERSION
