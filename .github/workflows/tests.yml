name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
      KESTRA_EE_UNIT_TEST_LICENSE_FILE:
        required: true
      KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE:
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./src/...

      - name: Check installer is working
        run: |
          cat ./install-scripts/install.sh | INSTALL_DIR=./ bash
          ./kestractl --help
      - name: Check installer is working when specifying version
        run: |
          cat ./install-scripts/install.sh | VERSION=1.0.0 INSTALL_DIR=./ bash
          ./kestractl --help

  list-versions:
    uses: ./.github/workflows/list-versions.yml

  e2e-tests:
    needs: list-versions
    # Fork PRs don't receive secrets (GCP creds for the private EE image, EE license), so e2e cannot run.
    # Skip them. workflow_dispatch/workflow_call and internal PRs still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kestra_version: ${{ fromJSON(needs.list-versions.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select license file
        id: license
        uses: ./.github/actions/set-license-file
        with:
          kestra_version: ${{ matrix.kestra_version }}
          license_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
          license_legacy_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: GCP - Auth with github service account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build local CLI and test it E2E
        env:
          KESTRA_VERSION: ${{ matrix.kestra_version }}
          KESTRA_EE_UNIT_TEST_LICENSE_FILE: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
          KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE }}
        run: |
          echo "${{ steps.license.outputs.license }}" | base64 -d > ./e2e_tests/docker-setup/application-secrets.yml
          sh run-e2e-tests.sh $KESTRA_VERSION

  notify-failure:
    name: Notify CI failure
    needs: [test, list-versions, e2e-tests]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs
        id: failed
        run: |
          failed=""
          [ "${{ needs.test.result }}" = "failure" ] && failed="$failed test"
          [ "${{ needs.list-versions.result }}" = "failure" ] && failed="$failed list-versions"
          [ "${{ needs.e2e-tests.result }}" = "failure" ] && failed="$failed e2e-tests"
          echo "list=${failed# }" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Slack - Notify CI failure
        if: always()
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: 'C09FE0QCN2E'
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
          extra-text: 'Failed jobs: ${{ steps.failed.outputs.list }}'
