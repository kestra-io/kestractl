name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./src/...

      - name: GCP - Auth with github service account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev
        
      - name: Build local CLI and test it E2E
        env:
          APPLICATION_SECRETS: ${{ secrets.APPLICATION_SECRETS }}
        run: |
          echo $APPLICATION_SECRETS | base64 -d > ./e2e_tests/docker-setup/application-secrets.yml
          sh run-e2e-tests.sh

      - name: Check installer is working
        run: |
          cat ./install-scripts/install.sh | INSTALL_DIR=./ bash
          ./kestractl --help
      - name: Check installer is working when specifying version
        run: |
          cat ./install-scripts/install.sh | VERSION=1.0.0 INSTALL_DIR=./ bash
          ./kestractl --help
