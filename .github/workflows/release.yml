name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

#      - name: Ensure tag is on main
#        run: |
#          git fetch origin main:refs/remotes/origin/main
#          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slack - announce a successful release to the releases channel
      - name: Slack notification
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          job_name: Release
          text: 'Release ${{ github.ref_name }}'
          fields: repo,commit,action,ref,job,took
          username: GitHub Actions
          icon_emoji: ':github-actions:'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

      # Slack - send release failures to the build alert channel
      - name: Slack - Notify release failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          job_name: Release
          text: 'Release ${{ github.ref_name }} failed.'
          fields: repo,commit,ref,took
          username: GitHub Actions
          icon_emoji: ':github-actions:'
          channel: 'C09FE0QCN2E'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
